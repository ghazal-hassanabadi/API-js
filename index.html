<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="styles/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
   


    <title>API</title>
</head>
<body>

    <header class="header">
        <h1 class="app-title">CineFind</h1>
        <p class="app-subtitle">Find Your Next Favorite Movie</p>
    </header>

    <main>
        <section class="search-section">
            <div class="search-box">
                <input type="text" id="search-input" class="search-input" placeholder="Search for a movie...">
                
                <button id="search-btn" class="search-btn">
                        <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

                <section id="loading-state" class="loading-state state"><p>Loading...</p></section>
                <section id="empty-state" class="empty-state state"> <p>No movies found. Try another search.</p> </section>
                <section id="error-state" class="error-state state"> <p>Something went wrong. Please try again.</p></section>

                <section id="results" class="results-grid"></section>
        </section>
    </main>

  
    

    <script src="js/index.js"></script>
</body>
</html>
